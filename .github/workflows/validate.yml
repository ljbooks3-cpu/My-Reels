name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required files
        run: test -f index.html && test -f app.css && test -f app.js
      - name: Confirm admin controls
        run: grep -q 'id="loginButton"' index.html && grep -q 'google.accounts.oauth2' app.js
      - name: Confirm public catalogue connection
        run: grep -q 'script.google.com/macros' app.js