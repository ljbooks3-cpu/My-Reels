name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required files
        run: test -f index.html && test -f app.css && test -f app.js
      - name: Confirm single-page app
        run: '! test -e creator.html'
      - name: Confirm authentication controls exist
        run: grep -q 'id="login"' index.html && grep -q 'id="logout"' index.html && grep -q 'google.accounts.oauth2' app.js
      - name: Confirm old public backend is gone
        run: '! grep -q "script.google.com/macros" app.js'
